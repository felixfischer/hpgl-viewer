# XcodeGen spec for the macOS Preview surface (spec #12, ticket #14).
#
# This file is the source of truth. The generated `*.xcodeproj`, the build
# output, the staged web bundle and the derived `Info.plist` / `.entitlements`
# files are all gitignored — never edit them by hand.
#
# Build with: pnpm package:macos   (from the repo root)
name: HPGLViewer
options:
  bundleIdPrefix: com.felixfischer
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Ad-hoc signing. This machine has no codesigning identities
    # (`security find-identity -v -p codesigning` -> "0 valid identities found");
    # `-` is the ad-hoc identity. Signing stays ON because an unsigned appex
    # carries no sandbox entitlement and Quick Look will not load it.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    # Release builds would not inject get-task-allow anyway; this keeps it out of Debug too.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

targets:
  # The carrier app: it only ships and registers the extension. There is no
  # native viewer here (spec #12, ADR-0009).
  HPGLViewer:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: HPGLPreviewExtension
        embed: true # copy-files phase into Contents/PlugIns
    entitlements:
      path: App/HPGLViewer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # No network entitlement: the carrier app does nothing but register the
        # extension. (The extension needs one — see its target below.)
    info:
      path: App/Info.plist
      properties:
        CFBundleName: HPGLViewer
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # One imported UTI covers all four filename extensions (spec story 23).
        # Imported (not exported): we do not own the format.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.felixfischer.hpgl
            UTTypeDescription: HP-GL Plotter File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hpgl, plt, hpg, hgl]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HP-GL Plotter File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.felixfischer.hpgl]

  HPGLPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      # The Swift sources, minus the staged resources (listed explicitly below).
      - path: PreviewExtension
        excludes: ["Resources/**"]
      # A folder reference (not a group): preserves the `preview/` subdirectory
      # so `Bundle.main.url(..., subdirectory: "preview")` resolves. The contents
      # are staged by scripts/package-macos.sh and are gitignored.
      - path: PreviewExtension/Resources/preview
        type: folder
        buildPhase: resources
    settings:
      base:
        # Explicit: the autogenerated id would not be prefixed by the app's id,
        # which the embed validation rejects. Must be prefixed by the app id.
        PRODUCT_BUNDLE_IDENTIFIER: com.felixfischer.HPGLViewer.PreviewExtension
    entitlements:
      path: PreviewExtension/HPGLPreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # DEVIATION (ticket #14, documented in packages/macos/README.md): without
        # this entitlement the sandboxed WKWebView cannot launch its WebContent
        # helper, so the preview renders nothing. Proven on this machine: with it
        # absent, `page didFinish` never fires and WebKit logs "web process failed
        # to launch" + a GPU-process crash; with it present the plot paints. The
        # load is a local `file://` and the extension makes no network requests.
        com.apple.security.network.client: true
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundlePackageType: XPC!
        CFBundleDisplayName: HP-GL Preview
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          # Swift-mangled: `PRODUCT_MODULE_NAME` expands to the target name.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            # Quick Look matches the resolved UTI exactly, not by conformance.
            # The `dyn.*` identifiers are the deterministic dynamic UTIs for each
            # extension, listed so previews still work before LaunchServices has
            # registered our imported declaration.
            QLSupportedContentTypes:
              - com.felixfischer.hpgl
              - dyn.ah62d4rv4ge80u6dhru # .hpgl
              - dyn.ah62d4rv4ge81a5dy # .plt
              - dyn.ah62d4rv4ge80u6dh # .hpg
              - dyn.ah62d4rv4ge80u35q # .hgl
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
